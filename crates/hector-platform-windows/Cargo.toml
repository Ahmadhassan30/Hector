[package]
name = "hector-platform-windows"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hector-protocol = { path = "../hector-protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
